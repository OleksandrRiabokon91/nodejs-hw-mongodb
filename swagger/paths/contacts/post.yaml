tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact name
            example: John Deere
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380931234567'
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            example: personal
          email:
            type: string
            format: email
            description: Contact email address (optional)
            example: john.deere@example.com
          isFavourite:
            type: boolean
            description: Indicates whether the contact is marked as favourite
            example: true
          photo:
            type: string
            format: binary
            description: Contact photo

responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
