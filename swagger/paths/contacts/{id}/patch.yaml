tags:
  - Contacts
summary: Update contact by id (partial update)
operationId: updateContact
description: >
  Partially update a contact by id.  
  You can update any field or only upload a new photo.
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 68e7ea086ff8813c7dbdf305

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        description: At least one field must be provided for update
        properties:
          name:
            type: string
            description: Contact name
            example: John Doe
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380931234567'
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            example: work
          email:
            type: string
            format: email
            description: Contact email address
            example: john.doe@example.com
          isFavourite:
            type: boolean
            description: Indicates whether the contact is marked as favourite
            example: true
          photo:
            type: string
            format: binary
            description: New photo for the contact (optional)

responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              $ref: ../../../components/schemas/contact.yaml

  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found

  '500':
    $ref: ../../../components/responses/500.yaml
