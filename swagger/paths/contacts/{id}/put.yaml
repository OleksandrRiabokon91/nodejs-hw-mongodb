tags:
  - Contacts
summary: Replace contact by id (full update or create new)
operationId: replaceContact
description: >
  Fully replace a contact by id.  
  If the contact exists, it will be fully updated.  
  If the contact does not exist, a new contact will be created with the provided id.
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 68e7ea086ff8813c7dbdf305

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - email
          - isFavourite
        properties:
          name:
            type: string
            description: Contact name
            example: John Deere
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380931234567'
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            example: personal
          email:
            type: string
            format: email
            description: Contact email
            example: john.deere@example.com
          isFavourite:
            type: boolean
            description: Indicates if the contact is marked as favourite
            example: false
          photo:
            type: string
            format: binary
            description: Contact photo

responses:
  '200':
    description: Contact successfully replaced
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact replaced successfully
            data:
              $ref: ../../../components/schemas/contact.yaml

  '201':
    description: Contact not found — new contact created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: No update ID found. A NEW contact has been created.
            data:
              $ref: ../../../components/schemas/contact.yaml

  '404':
    description: Contact not found or not created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found or not created

  '500':
    $ref: ../../../components/responses/500.yaml
