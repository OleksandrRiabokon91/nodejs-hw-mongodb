tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: Delete contact by id
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 68e7ea086ff8813c7dbdf305
responses:
  '204':
    description: Contact successfully deleted
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
