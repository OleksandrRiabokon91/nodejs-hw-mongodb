tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts with pagination, sorting, and filtering.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination.
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Number of contacts per page.
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [_id, name, phoneNumber, email, createdAt, updatedAt]
    description: Field to sort by.
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sorting order.
  - in: query
    name: contactTypeFilter
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type.
  - in: query
    name: isFavouriteFilter
    schema:
      type: boolean
    description: Filter contacts marked as favourite or not.
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
