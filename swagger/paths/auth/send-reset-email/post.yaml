tags:
  - Auth
summary: Send reset password email
operationId: sendResetEmail
description: 'Sends a password reset email to the user.
  ⚠️ **Note:** On the current free deployment of the server (Render free plan), email delivery is blocked.
  Password reset emails will only be sent successfully on a paid plan where email sending is enabled.'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: john@example.com
responses:
  '200':
    description: Reset email sent successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
              example: {}
  '404':
    description: User with this email not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: User with this email not found
