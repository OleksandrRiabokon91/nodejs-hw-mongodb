tags:
  - Auth
summary: Refresh user session
operationId: refreshSession
description: Refresh access token using sessionId and refreshToken stored in cookies.
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully refreshed session
    headers:
      Set-Cookie:
        schema:
          type: string
          example: refreshToken=xxx; HttpOnly
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIs...
  '401':
    description: Session not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Session not found
